services:
  spark-master:
    build:
      context: ..
      dockerfile: lakehouse/Dockerfile.spark
    image: materials-dmp-spark:4.1.3-iceberg-1.12.0
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - lakehouse_warehouse:/warehouse
      - spark_events:/spark-events
    restart: unless-stopped

  spark-worker:
    image: materials-dmp-spark:4.1.3-iceberg-1.12.0
    hostname: spark-worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 2g
      - --webui-port
      - "8081"
    ports:
      - "8082:8081"
    volumes:
      - lakehouse_warehouse:/warehouse
      - spark_events:/spark-events
    depends_on:
      - spark-master
    restart: unless-stopped

  spark-history:
    image: materials-dmp-spark:4.1.3-iceberg-1.12.0
    hostname: spark-history
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.history.HistoryServer
    environment:
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=file:///spark-events
        -Dspark.history.ui.port=18080
    ports:
      - "18080:18080"
    volumes:
      - spark_events:/spark-events
    depends_on:
      - spark-master
    restart: unless-stopped

  spark-submit:
    image: materials-dmp-spark:4.1.3-iceberg-1.12.0
    hostname: spark-submit
    profiles:
      - jobs
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_EVENT_LOG_DIR: file:///spark-events
      ICEBERG_WAREHOUSE_URI: file:///warehouse
      LAKEHOUSE_CATALOG: lakehouse
      DMP_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-materials_dmp}
      DMP_JDBC_USER: ${POSTGRES_USER:-materials}
      DMP_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-materials_secret}
      DMP_FAIL_ON_QUALITY_ERRORS: ${DMP_FAIL_ON_QUALITY_ERRORS:-false}
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.driver.host=spark-submit
      - /opt/materials-dmp/lakehouse/jobs/pipeline.py
      - --source
      - ${LAKEHOUSE_SOURCE:-demo}
    volumes:
      - lakehouse_warehouse:/warehouse
      - spark_events:/spark-events
    depends_on:
      - spark-master
      - spark-worker

volumes:
  lakehouse_warehouse:
  spark_events:

